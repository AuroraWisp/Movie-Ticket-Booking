<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-body">

    <!-- Landing View -->
    <div id="landing-view" class="container hero-container">
        <h1>🎬 Movie Booking System</h1>
        <p>Book your favorite movies easily !!!</p>
        <button onclick="showAuth('login')" class="btn primary-btn">Enter</button>
    </div>

    <!-- Auth View (Hidden initially) -->
    <div id="auth-view" class="container form-container" style="display: none;">
        <h2 id="auth-title">User Login</h2>
        <p id="auth-error" class="error-msg"></p>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <input type="text" id="auth-name" placeholder="Full Name" style="display: none;">
            <input type="email" id="auth-email" placeholder="Email" required>
            <input type="password" id="auth-password" placeholder="Password" required>
            <button type="submit" id="auth-btn" class="btn">Login</button>
        </form>

        <div class="footer-link" id="auth-toggle-text">
            New user? <a href="#" onclick="showAuth('register')">Register here</a>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function showAuth(mode) {
            currentMode = mode;
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('auth-view').style.display = 'block';
            document.getElementById('auth-error').innerText = '';

            if (mode === 'register') {
                document.getElementById('auth-title').innerText = 'User Registration';
                document.getElementById('auth-name').style.display = 'block';
                document.getElementById('auth-btn').innerText = 'Register';
                document.getElementById('auth-toggle-text').innerHTML = 'Already have an account? <a href="#" onclick="showAuth(\'login\')">Login here</a>';
            } else {
                document.getElementById('auth-title').innerText = 'User Login';
                document.getElementById('auth-name').style.display = 'none';
                document.getElementById('auth-btn').innerText = 'Login';
                document.getElementById('auth-toggle-text').innerHTML = 'New user? <a href="#" onclick="showAuth(\'register\')">Register here</a>';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;

            let users = JSON.parse(localStorage.getItem('users')) || [];

            if (currentMode === 'register') {
                if (users.some(u => u.email === email)) {
                    document.getElementById('auth-error').innerText = 'Account already exists!';
                    return;
                }
                users.push({ name, email, password });
                localStorage.setItem('users', JSON.stringify(users));
                alert('Registration successful! Please login.');
                showAuth('login');
            } else {
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'movies.html';
                } else {
                    document.getElementById('auth-error').innerText = 'Invalid Email or Password';
                }
            }
        }
    </script>
</body>
</html>
