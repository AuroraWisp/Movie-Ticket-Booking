<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-body">
    <div class="container form-container">
        <h2 id="payment-movie-title">Payment</h2>

        <p id="payment-error" class="error-msg"></p>

        <p>Selected Seats: <b id="summary-seats">-</b></p>
        <p>Price per seat: <b id="summary-unit-price">Tk 0.00</b></p>
        <p>Total seats: <b id="summary-count">0</b></p>
        <p>Total price: <b id="summary-subtotal">Tk 0.00</b></p>
        <p id="discount-row" style="display: none;">Discount (10%): <b id="summary-discount">Tk 0.00</b></p>
        
        <h3>Amount to Pay: <span id="summary-total">Tk 0.00</span></h3>

        <form id="payment-form" onsubmit="handlePayment(event)">
            <input type="text" id="card-num" placeholder="Enter Card Number" required autocomplete="off">
            
            <div style="margin-top: 15px;">
                <button type="submit" class="btn action-btn">Confirm Payment</button>
                <button type="button" onclick="goBackToSeats()" class="btn secondary-btn" style="margin-left: 10px;">Back</button>
            </div>
        </form>
    </div>

    <script>
        if (!localStorage.getItem('currentUser')) window.location.href = 'index.html';

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('movie_id');
        const seatsParam = urlParams.get('seats');

        if (!movieId || !seatsParam) {
            alert('Invalid payment request.');
            window.location.href = 'movies.html';
        }

        const selectedSeats = seatsParam.split(',');
        const movies = {
            '1': { title: 'Interstellar', price: 250, show_time: '06:00 PM' },
            '2': { title: 'The Dark Knight', price: 220, show_time: '09:00 PM' },
            '3': { title: 'Inception', price: 200, show_time: '03:00 PM' }
        };

        const currentMovie = movies[movieId] || { title: 'Movie', price: 200, show_time: 'N/A' };
        document.getElementById('payment-movie-title').innerText = `Payment for "${currentMovie.title}"`;

        const totalSeats = selectedSeats.length;
        const seatPrice = currentMovie.price;
        const subtotal = totalSeats * seatPrice;
        const discount = totalSeats >= 3 ? subtotal * 0.10 : 0;
        const finalPrice = subtotal - discount;

        document.getElementById('summary-seats').innerText = selectedSeats.join(', ');
        document.getElementById('summary-unit-price').innerText = `Tk ${seatPrice.toFixed(2)}`;
        document.getElementById('summary-count').innerText = totalSeats;
        document.getElementById('summary-subtotal').innerText = `Tk ${subtotal.toFixed(2)}`;

        if (discount > 0) {
            document.getElementById('discount-row').style.display = 'block';
            document.getElementById('summary-discount').innerText = `Tk ${discount.toFixed(2)}`;
        }

        document.getElementById('summary-total').innerText = `Tk ${finalPrice.toFixed(2)}`;

        function handlePayment(event) {
            event.preventDefault();
            const cardInput = document.getElementById('card-num').value.replace(/\D/g, '');

            if (cardInput.length < 12 || cardInput.length > 19) {
                document.getElementById('payment-error').innerText = 'Invalid card number. Please enter 12 to 19 digits.';
                return;
            }

            // Save seats as booked into localStorage
            let bookedSeats = JSON.parse(localStorage.getItem(`booked_movie_${movieId}`)) || ['A1', 'B3'];
            bookedSeats.push(...selectedSeats);
            localStorage.setItem(`booked_movie_${movieId}`, JSON.stringify(bookedSeats));

            // Create digital receipt data
            const receiptData = {
                bookingId: 'BK-' + Math.floor(100000 + Math.random() * 900000),
                movieTitle: currentMovie.title,
                showTime: currentMovie.show_time,
                seats: selectedSeats.join(', '),
                totalSeats: totalSeats,
                amountPaid: finalPrice.toFixed(2),
                paymentDate: new Date().toLocaleString()
            };

            localStorage.setItem('latestReceipt', JSON.stringify(receiptData));
            window.location.href = 'success.html';
        }

        function goBackToSeats() {
            window.location.href = `seats.html?id=${movieId}`;
        }
    </script>
</body>
</html>
