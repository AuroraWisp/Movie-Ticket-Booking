<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Successful</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ticket-box {
            background-color: #222;
            border: 2px dashed #ccff90;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .ticket-box p {
            margin: 10px 0;
            font-size: 16px;
        }
        .ticket-header {
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        /* Hide buttons when printing ticket */
        @media print {
            .btn-group, .logout-container, h2, p:first-of-type {
                display: none !important;
            }
            body {
                background: none;
                color: #000;
            }
            .container {
                box-shadow: none;
                background: #fff;
                color: #000;
            }
            .ticket-box {
                border: 2px solid #000;
                color: #000;
            }
            .ticket-header {
                border-bottom: 1px solid #000;
            }
            h3, small, span, strong {
                color: #000 !important;
            }
        }
    </style>
</head>
<body class="center-body">
    <div class="container form-container">
        <h2>🎉 Booking Successful!</h2>
        <p>Thank you for your purchase. Here is your ticket receipt:</p>

        <div class="ticket-box">
            <div class="ticket-header">
                <h3>🎟️ MOVIE TICKET RECEIPT</h3>
                <small id="receipt-id">Booking ID: -</small>
            </div>
            <p><strong>Movie:</strong> <span id="receipt-movie">-</span></p>
            <p><strong>Show Time:</strong> <span id="receipt-time">-</span></p>
            <p><strong>Seats Booked:</strong> <span id="receipt-seats">-</span></p>
            <p><strong>Total Seats:</strong> <span id="receipt-count">-</span></p>
            <p><strong>Total Paid:</strong> <span id="receipt-amount">-</span></p>
            <p><strong>Date & Time:</strong> <span id="receipt-date">-</span></p>
        </div>

        <div class="btn-group">
            <button onclick="window.print()" class="btn action-btn">🖨️ Print Ticket</button>
            <a href="movies.html" class="btn secondary-btn">Book Another Movie</a>
            <button onclick="exitApp()" class="btn logout-btn">🚪 Exit</button>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('currentUser')) window.location.href = 'index.html';

        const receipt = JSON.parse(localStorage.getItem('latestReceipt'));

        if (!receipt) {
            window.location.href = 'movies.html';
        } else {
            document.getElementById('receipt-id').innerText = `Booking ID: ${receipt.bookingId}`;
            document.getElementById('receipt-movie').innerText = receipt.movieTitle;
            document.getElementById('receipt-time').innerText = receipt.showTime;
            document.getElementById('receipt-seats').innerText = receipt.seats;
            document.getElementById('receipt-count').innerText = receipt.totalSeats;
            document.getElementById('receipt-amount').innerText = `Tk ${receipt.amountPaid}`;
            document.getElementById('receipt-date').innerText = receipt.paymentDate;
        }

        function exitApp() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('latestReceipt');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
